<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cross-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Card -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bg-gradient)" filter="url(#shadow)" />

  <!-- Clipboard outline / medical chart -->
  <rect x="14" y="16" width="36" height="40" rx="6" fill="#ffffff" />
  
  <!-- Clipboard top clip -->
  <rect x="23" y="11" width="18" height="9" rx="3.5" fill="#e2e8f0" stroke="#0f766e" stroke-width="1.5" />
  <circle cx="32" cy="15.5" r="2" fill="#0f766e" />

  <!-- Medical Cross on chart -->
  <rect x="29" y="24" width="6" height="14" rx="2" fill="url(#cross-gradient)" />
  <rect x="25" y="28" width="14" height="6" rx="2" fill="url(#cross-gradient)" />

  <!-- Nursing Record Pulse / Notes lines -->
  <path d="M19 44 L25 44 L28 40 L31 48 L34 42 L37 44 L45 44" stroke="#0d9488" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <rect x="20" y="50" width="24" height="2" rx="1" fill="#cbd5e1" />
</svg>
